# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.application.name=enterprise-management-system

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging
logging.level.root=INFO
logging.level.com.enterprise=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# JWT Configuration (backwards-compatible keys preserved)
jwt.secret=your-super-secret-jwt-key-change-this-in-production-at-least-256-bits-long
jwt.expiration=3600000
jwt.refresh.expiration=604800000

# New security.jwt.* properties (used by JwtUtil and services)
security.jwt.secret=${jwt.secret}
security.jwt.expiration-seconds=3600
security.refresh-token.expiration-seconds=604800

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload Configuration
file.upload.dir=uploads/
file.upload.max-size=10485760

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://yourfrontend.vercel.app
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.max-age=3600

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
